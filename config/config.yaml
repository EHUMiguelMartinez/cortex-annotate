builtin_annotations:
  Wang Atlas:
    type: points
    plot_options:
      color: [1, 1, 0]
      markersize: 1
      visible: false
    data: |
      fmap = target['flatmap']
      (u, v) = fmap.tess.indexed_edges
      w = fmap.prop('wang15')
      xy = fmap.coordinates
      ii = w[u] != w[v]
      dat = np.mean([xy[:, u[ii]], xy[:, v[ii]]], axis=0)
      return [dat.T]
  Wang V3d:
    type: points
    plot_options:
      color: [0, 1, 1]
      markersize: 1
      visible: false
    data: |
