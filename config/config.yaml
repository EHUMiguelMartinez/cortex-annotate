  cod: |
    ny.cortex_plot(target['flatmap'], color="cod", axes=axes,
                   cmap='hot', vmin=0, vmax=1)
  curvature: |
    ny.cortex_plot(target['flatmap'], axes=axes)

review: |
  import numpy as np
  # V1v / V1d (split at the new HM line):
  v1uvm = annotations['V1 UVM (ventral)']
  v1hm  = annotations['V1 HM (horizontal meridian)']
  v1lvm = annotations['V1 LVM (dorsal)']
  v1vper = annotations['V1 Ventral Periphery']
  v1dper = annotations['V1 Dorsal Periphery']
  v1v_poly = np.vstack([v1uvm, v1vper, np.flipud(v1hm)])
  v1d_poly = np.vstack([v1hm, v1dper, np.flipud(v1lvm)])

  # V2v / V2d (closed along the V2 HM link V1-fovea -> V2-fovea):
  v2uvm = annotations['V2 UVM (ventral)']
  v2lvm = annotations['V2 LVM (dorsal)']
  v2pev = annotations['V2 Ventral Periphery']
  v2ped = annotations['V2 Dorsal Periphery']
  try:
      v2hm = annotations['V2 HM']
  except KeyError:
      v2hm = np.zeros((0, 2))   # older annotations without the link: old behaviour
  v2v_poly = np.vstack([v2uvm, v2pev, np.flipud(v1uvm), v2hm])
  v2d_poly = np.vstack([v1lvm, np.flipud(v2ped), np.flipud(v2lvm), np.flipud(v2hm)])

  # V3v / V3d (closed along the V3 HM link V2-fovea -> V3-fovea):
  v3uvm = annotations['V3 UVM (ventral)']
  v3lvm = annotations['V3 LVM (dorsal)']
  v3pev = annotations['V3 Ventral Periphery']
  v3ped = annotations['V3 Dorsal Periphery']
  try:
      v3hm = annotations['V3 HM']
  except KeyError:
      v3hm = np.zeros((0, 2))
  v3v_poly = np.vstack([v3uvm, v3pev, np.flipud(v2uvm), v3hm])
  v3d_poly = np.vstack([v2lvm, np.flipud(v3ped), np.flipud(v3lvm), np.flipud(v3hm)])

  # Turn each of the six polygons into a path/label:
  fmap = target['flatmap']
  cortex = target['cortex']
  polys = {
      'V1v': v1v_poly, 'V1d': v1d_poly,
      'V2v': v2v_poly, 'V2d': v2d_poly,
      'V3v': v3v_poly, 'V3d': v3d_poly}

  labels = np.zeros(cortex.vertex_count, dtype=int)
  for i, (name, poly) in enumerate(polys.items(), start=1):
      trace = ny.path_trace(fmap, poly.T, closed=True)
      path = trace.to_path(cortex)
      inside = path.label > 0.5
      if np.sum(inside) > np.sum(~inside):
          inside = ~inside
      labels[inside & (labels == 0)] = i
  
  # hV4 (label 7) — free closed contour; V1-V3 take priority over overlap
  try:
      hv4_poly = annotations['hV4']
      if hv4_poly is not None and len(hv4_poly) >= 3:
          hv4_trace = ny.path_trace(fmap, hv4_poly.T, closed=True)
          hv4_path = hv4_trace.to_path(cortex)
          hv4_inside = hv4_path.label > 0.5
          if np.sum(hv4_inside) > np.sum(~hv4_inside):
              hv4_inside = ~hv4_inside
          labels[hv4_inside & (labels == 0)] = 7
  except KeyError:
      pass  # hV4 not drawn yet for this subject/hemisphere — skip

  # VO1 (label 8) — free closed contour; V1-V3 and hV4 take priority over overlap
  try:
      vo1_poly = annotations['VO1']
      if vo1_poly is not None and len(vo1_poly) >= 3:
          vo1_trace = ny.path_trace(fmap, vo1_poly.T, closed=True)
          vo1_path = vo1_trace.to_path(cortex)
          vo1_inside = vo1_path.label > 0.5
          if np.sum(vo1_inside) > np.sum(~vo1_inside):
              vo1_inside = ~vo1_inside
          labels[vo1_inside & (labels == 0)] = 8
  except KeyError:
      pass  # VO1 not drawn yet for this subject/hemisphere — skip
      
  # V3a (label 9) — free closed contour; V1-V3, hV4, VO1 take priority
  try:
      v3a_poly = annotations['V3a']
      if v3a_poly is not None and len(v3a_poly) >= 3:
          v3a_trace = ny.path_trace(fmap, v3a_poly.T, closed=True)
          v3a_path = v3a_trace.to_path(cortex)
          v3a_inside = v3a_path.label > 0.5
          if np.sum(v3a_inside) > np.sum(~v3a_inside):
              v3a_inside = ~v3a_inside
          labels[v3a_inside & (labels == 0)] = 9
  except KeyError:
      pass  # V3a not drawn yet for this subject/hemisphere — skip

  # IPS0 (label 10) — free closed contour; all previous ROIs take priority
  try:
      ips0_poly = annotations['IPS0']
      if ips0_poly is not None and len(ips0_poly) >= 3:
          ips0_trace = ny.path_trace(fmap, ips0_poly.T, closed=True)
          ips0_path = ips0_trace.to_path(cortex)
          ips0_inside = ips0_path.label > 0.5
          if np.sum(ips0_inside) > np.sum(~ips0_inside):
              ips0_inside = ~ips0_inside
          labels[ips0_inside & (labels == 0)] = 10
  except KeyError:
      pass  # IPS0 not drawn yet for this subject/hemisphere — skip

  # IPS1 (label 11) — free closed contour; all previous ROIs take priority
  try:
      ips1_poly = annotations['IPS1']
      if ips1_poly is not None and len(ips1_poly) >= 3:
          ips1_trace = ny.path_trace(fmap, ips1_poly.T, closed=True)
          ips1_path = ips1_trace.to_path(cortex)
          ips1_inside = ips1_path.label > 0.5
          if np.sum(ips1_inside) > np.sum(~ips1_inside):
              ips1_inside = ~ips1_inside
          labels[ips1_inside & (labels == 0)] = 11
  except KeyError:
      pass  # IPS1 not drawn yet for this subject/hemisphere — skip

  # ---- Version 1: everything drawn, fovea INCLUDED ----
  labels_withfovea = labels.copy()

  # ---- Version 2: same, but with the Exclusion Fovea contour zeroed ----
  labels_nofovea = labels.copy()
  try:
      excl_poly = annotations['Exclusion Fovea']
      if excl_poly is not None and len(excl_poly) >= 3:
          excl_trace = ny.path_trace(fmap, excl_poly.T, closed=True)
          excl_path = excl_trace.to_path(cortex)
          excl_inside = excl_path.label > 0.5
          if np.sum(excl_inside) > np.sum(~excl_inside):
              excl_inside = ~excl_inside
          labels_nofovea[excl_inside] = 0
  except KeyError:
      pass  # contour not drawn yet for this subject/hemisphere

  sid = target['Subject ID']                 # e.g. 'sub-03'
  hemi = target['Hemisphere']                # 'LH' or 'RH'
  roi_tag = 'v1v-v1d-v2v-v2d-v3v-v3d-hV4-VO1-V3a-IPS0-IPS1'

  save_hooks[f'{sid}_hemi-{hemi}_{roi_tag}_withfovea.mgz'] = \
      lambda filename: ny.save(filename, labels_withfovea)
  save_hooks[f'{sid}_hemi-{hemi}_{roi_tag}_nofovea.mgz'] = \
      lambda filename: ny.save(filename, labels_nofovea)

  from matplotlib.colors import ListedColormap
  label_cmap = ListedColormap([
      '#e6194b',  # 1  V1v
      '#f58231',  # 2  V1d
      '#ffe119',  # 3  V2v
      '#3cb44b',  # 4  V2d
      '#42d4f4',  # 5  V3v
      '#4363d8',  # 6  V3d
      '#911eb4',  # 7  hV4
      '#f032e6',  # 8  VO1
      '#9a6324',  # 9  V3a
      '#800000',  # 10 IPS0
      '#000075']) # 11 IPS1

  axes.axis('off')
  ax_left  = axes.inset_axes([0.00, 0.0, 0.49, 1.0])
  ax_right = axes.inset_axes([0.51, 0.0, 0.49, 1.0])
  for ax, lab, title in ((ax_left,  labels_withfovea, 'with fovea'),
                         (ax_right, labels_nofovea,   'fovea excluded')):
      fl = lab[fmap.labels]
      ny.cortex_plot(
          fmap,
          color=fl,
          cmap=label_cmap,
          vmin=1, vmax=11,
          mask=(fl > 0),
          axes=ax,
          alpha=0.5)
      ax.axis('equal')
      ax.axis('off')
      ax.set_title(title, fontsize=8)

