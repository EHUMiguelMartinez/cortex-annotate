################################################################################
# Configuration for cortex-annotate — VOTCLOC project
# Manual delineation of visual field maps using empirical pRF data from
# mrVista (via prfanalyze-vista), on native FreeSurfer surfaces.

display:
  figsize: [4, 4]
  dpi: 128
  plot_options:
    color: [0.25, 0.25, 0.75]
    linewidth: 1
    markersize: 1
    linestyle: "solid"
  fg_options:
    color: [0.55, 0.55, 0.9]
    markersize: 2

init: |
  import numpy as np
  import neuropythy as ny
  import os

  subjects_dir = '/bcbl/home/public/Gari/VOTCLOC/main_exp/BIDS/derivatives/freesurfer-with_t2'
  prf_dir = '/bcbl/home/public/Gari/VOTCLOC/main_exp/BIDS/derivatives/prfanalyze-vista/analysis-02_one_gaussian'

  # Which task/run to use for generating the delineation maps.
  # retCB = checkerboard, run-0102avg = averaged across the two checkerboard runs.
  prf_task = 'retCB'
  prf_run = 'run-0102avg'
  max_valid_ecc = 100

  # This occipital pole mask is used with neuropythy's flatmap code; the tuple
  # indicates that the FreeSurfer parcellation property uses the value 43 to
  # indicate the occipital pole of the brain.
  occpole_mask = ('parcellation', 43)

targets:
  Subject ID:
    - sub-01
    - sub-02
    - sub-03
    - sub-04
    - sub-05
    - sub-06
    - sub-07
    - sub-08
    - sub-09
    - sub-10
    - sub-11

  subject: |
    sid = target['Subject ID']
    fs_path = os.path.join(subjects_dir, sid)
    return ny.freesurfer_subject(fs_path)

  Hemisphere:
    - LH
    - RH

  cortex: |
    import glob, json
    sid = target['Subject ID']
    sub = target['subject']
    h = target['Hemisphere'].lower()
    hemi_code = 'L' if h == 'lh' else 'R'
    cortex = sub.hemis[h]
    n = cortex.vertex_count

    # Find every session this subject has any data for.
    session_dirs = sorted(glob.glob(os.path.join(prf_dir, sid, 'ses-*')))
    session_ids = [os.path.basename(d) for d in session_dirs]

    x0_stack = []
    y0_stack = []
    r2_stack = []

    for ses in session_ids:
        sub_prf_dir = os.path.join(prf_dir, sid, ses)
        prefix = f'{sid}_{ses}_task-{prf_task}_{prf_run}_hemi-{hemi_code}_'
        x0_path = os.path.join(sub_prf_dir, prefix + 'centerx0.nii.gz')
        if not os.path.isfile(x0_path):
            continue  # this session has no retCB run-0102avg data (e.g. WC session instead); skip it

        maskinfo_dir = os.path.join(
            '/bcbl/home/public/Gari/VOTCLOC/main_exp/BIDS/derivatives/prfprepare/analysis-02_votcROI',
            sid, ses, 'func')
        maskinfo_files = glob.glob(os.path.join(
            maskinfo_dir, f'{sid}_{ses}_hemi-{hemi_code}_desc-*_maskinfo.json'))
        if not maskinfo_files:
            continue  # no mask info for this session; skip it

        all_bold_positions = []
        for f in maskinfo_files:
            d = json.load(open(f))
            all_bold_positions.extend(d['roiIndBold'])
        n_masked = max(all_bold_positions) + 1

        vertex_indices = np.full(n_masked, -1, dtype=int)
        for f in maskinfo_files:
            d = json.load(open(f))
            for fs_id, pos in zip(d['roiIndFsnative'], d['roiIndBold']):
                vertex_indices[pos] = fs_id

        x0_masked = np.asarray(ny.load(x0_path)).flatten()
        y0_masked = np.asarray(ny.load(os.path.join(sub_prf_dir, prefix + 'centery0.nii.gz'))).flatten()
        r2_masked = np.asarray(ny.load(os.path.join(sub_prf_dir, prefix + 'r2.nii.gz'))).flatten()

        x0_full = np.full(n, np.nan)
        y0_full = np.full(n, np.nan)
        r2_full = np.full(n, np.nan)
        valid = vertex_indices >= 0
        x0_full[vertex_indices[valid]] = x0_masked[valid]
        y0_full[vertex_indices[valid]] = y0_masked[valid]
        r2_full[vertex_indices[valid]] = r2_masked[valid]

        # Drop low-quality fits on a per-vertex, per-session basis so a bad
        # session doesn't drag down the average for vertices that were fit
        # well in other sessions.
        r2_full[r2_full < 0.022] = np.nan
        x0_full[np.isnan(r2_full)] = np.nan
        y0_full[np.isnan(r2_full)] = np.nan

        x0_stack.append(x0_full)
        y0_stack.append(y0_full)
        r2_stack.append(r2_full)
        too_far = np.sqrt(x0_full**2 + y0_full**2) > max_valid_ecc
        x0_full[too_far] = np.nan
        y0_full[too_far] = np.nan
        r2_full[too_far] = np.nan

    print(f"{sid}/{h}: used {len(x0_stack)} of {len(session_ids)} sessions found")

    x0_stack = np.array(x0_stack)
    y0_stack = np.array(y0_stack)
    r2_stack = np.array(r2_stack)

    # Average x0/y0 (Cartesian, safe to average directly) across sessions,
    # ignoring NaNs. Never average polar angle directly (it's circular).
    x0_mean = np.nanmean(x0_stack, axis=0)
    y0_mean = np.nanmean(y0_stack, axis=0)
    r2_mean = np.nanmean(r2_stack, axis=0)

    eccentricity = np.sqrt(x0_mean**2 + y0_mean**2)
    ang = np.degrees(np.arctan2(-y0_mean, x0_mean))
    polar_angle = np.mod(90 - ang + 180, 360) - 180

    r2_mean_filled = np.nan_to_num(r2_mean, nan=0.0)
    valid_thresh = r2_mean_filled > 0.022
    polar_angle_masked = np.where(valid_thresh, polar_angle, np.nan)
    eccentricity_masked = np.where(valid_thresh, eccentricity, np.nan)

    props = {
        'polar_angle': polar_angle_masked,
        'eccentricity': eccentricity_masked,
        'cod': r2_mean_filled}
        
    # Build a Wang-atlas label array (for the overlay only, not used in fitting).
    wang_label = np.zeros(n, dtype=int)
    wang_names = ['V1v','V1d','V2v','V2d','V3v','V3d','hV4','VO1','V3a','IPS0','IPS1','V3b','TO2']
    first_session_dir = os.path.join(
        '/bcbl/home/public/Gari/VOTCLOC/main_exp/BIDS/derivatives/prfprepare/analysis-02_votcROI',
        sid, session_ids[0], 'func')
    for i, roi in enumerate(wang_names, start=1):
        f = os.path.join(first_session_dir, f'{sid}_{session_ids[0]}_hemi-{hemi_code}_desc-{roi}-wang_maskinfo.json')
        if os.path.isfile(f):
            d = json.load(open(f))
            wang_label[d['roiIndFsnative']] = i
    props['wang15'] = wang_label

    return cortex.with_prop(props)

  flatmap: |
    cortex = target['cortex']
    return cortex.mask_flatmap(occpole_mask, map_right='right', radius=np.pi/2)

